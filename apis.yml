aid: hihello
name: HiHello
description: 'HiHello is a digital business card and professional-presence platform that
  lets individuals and teams create, share, and manage modern contact cards, email
  signatures, and virtual backgrounds. It replaces paper business cards with QR-code
  and link-based sharing, captures inbound contacts, and syncs them into CRMs and
  address books. For organizations it adds branded team cards, centralized administration,
  SSO (OAuth 2.0 and SAML), SCIM/HRIS provisioning, and analytics. HiHello integrates
  with tools such as Salesforce, HubSpot, Microsoft Dynamics, Google Contacts, Outlook,
  Zapier, and Okta. The company was surfaced as a Foundry Group portfolio company and
  added to the API Evangelist network. HiHello does not currently publish a public
  developer API, SDKs, or API documentation; integration is delivered through pre-built
  connectors and enterprise identity protocols.'
